services:
  dind:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-data:/var/lib/docker
    networks:
      - devnet


  devbox:
    build:
      context: .
      dockerfile: infra/dev/Dockerfile.devbox
    working_dir: /workspace/flash-summary
    environment:
      DOCKER_HOST: tcp://dind:2375
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - .:/workspace/flash-summary
    depends_on:
      - dind
    networks:
      - devnet
    stdin_open: true
    tty: true

volumes:
  dind-data: